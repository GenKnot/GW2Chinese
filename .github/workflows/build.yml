name: Build EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pymem pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --name GW2Chinese main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GW2Chinese
          path: dist/GW2Chinese.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GW2Chinese.exe
